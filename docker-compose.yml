services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-record-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_record
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 图片/音频/附件的对象存储，记录工作流上传后前端直接按 URL 预览。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-record-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
