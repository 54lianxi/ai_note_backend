[project]
name = "ai-record"
version = "0.1.0"
description = "AI-powered multimodal recording app with conversational interface"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "openai>=1.50",
    "httpx>=0.27",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-dotenv>=1.0",
    "websockets>=13",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
